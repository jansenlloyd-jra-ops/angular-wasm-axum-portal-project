<div class="table-container">
  <table mat-table [dataSource]="dataSource_Providers" class="mat-elevation-z8">
    <ng-container matColumnDef="kpc_id">
      <th mat-header-cell *matHeaderCellDef class="col-kpc_id">KPC ID</th>
      <td mat-cell *matCellDef="let element">{{element.kpc_id}}</td>
    </ng-container>
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef class="col-name">Name</th>
      <td mat-cell *matCellDef="let element">{{element.name}}</td>
    </ng-container>
    <ng-container matColumnDef="provider">
      <th mat-header-cell *matHeaderCellDef class="col-provider">Provider</th>
      <td mat-cell *matCellDef="let element">{{element.provider}}</td>
    </ng-container>
    <ng-container matColumnDef="configuration">
      <th mat-header-cell *matHeaderCellDef class="col-config">Configuration</th>
      <td mat-cell *matCellDef="let element">{{element.configuration}}</td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns:displayedColumns"></tr>
  </table>
  <div class="toolbar">
    <div class="button-group">
      <button mat-raised-button color="primary" class="button" (click)="loadProviders()" [disabled]="loading">
        {{ loading ? 'Refreshing...' : 'Refresh' }}
      </button>
      <button mat-raised-button color="primary" class="button" (click)="openKPC()" [disabled]="loading">
        {{ loading ? 'Creating...' : 'Create Key Provider Configuration' }}
      </button>
    </div>
    <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  </div>
</div>
