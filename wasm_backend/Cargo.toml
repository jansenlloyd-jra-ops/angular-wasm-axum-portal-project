[package]
name = "wasm_backend"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest-wasm = { version = "0.11", features = ["json"] }
web-sys = { version = "0.3.81", features = ["Window", "Location"] }
